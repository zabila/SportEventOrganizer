name: Build and run tests

on:
  push:
    branches:
      - master
      - development
      - tests

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore ./Sportalytics.sln

    - name: Build
      run: dotnet build ./Sportalytics.sln --configuration Release --no-restore
      
    - name: Test
      run: dotnet test ./Sportalytics.sln --no-build --verbosity normal
